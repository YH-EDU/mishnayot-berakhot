<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>משניות ברכות · משנה סדורה ומשנת חיים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="quiz.css" />
  <style>
    :root {
      --ink: #1c140c;
      --parchment: #f7f0e2;
      --gold: #c9a227;
      --gold-soft: #e6c86a;
      --gold-deep: #8a6b14;
      --navy: #1e3a5f;
      --overlay: rgba(18, 12, 6, 0.62);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      --dock-h: 58px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      background: #140f0a;
      color: var(--ink);
      font-family: "Assistant", "Segoe UI", sans-serif;
    }
    body { overflow: hidden; display: flex; flex-direction: column; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-logo {
      width: 48px;
      height: auto;
      display: block;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
    }
    .brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
    .brand strong { font-size: 0.98rem; font-weight: 700; }
    .brand span { font-size: 0.72rem; opacity: 0.75; }
    .header-view { display: flex; align-items: center; gap: 6px; direction: ltr; }
    .fs-btn { flex-shrink: 0; }
    .ghost-btn, .zoom-readout {
      appearance: none;
      border: 1px solid rgba(230, 200, 106, 0.32);
      background: rgba(255, 255, 255, 0.04);
      color: var(--parchment);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      line-height: 1;
      height: 36px;
    }
    .ghost-btn:hover { background: rgba(230, 200, 106, 0.14); }
    .ghost-btn:disabled { opacity: 0.38; cursor: default; pointer-events: none; }
    .ghost-btn.is-on, .ghost-btn[aria-pressed="true"] {
      background: rgba(230, 200, 106, 0.22);
      border-color: var(--gold-soft);
    }
    .ghost-btn.icon-only {
      width: 36px; height: 36px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .zoom-readout { min-width: 58px; text-align: center; cursor: default; }

    .viewport {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      direction: ltr;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
      background: #efe6d4;
      scrollbar-width: none;
    }
    .viewport::-webkit-scrollbar { display: none; }
    .stage {
      min-height: 100%;
      min-width: 100%;
      width: max-content;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: calc(var(--dock-h) + 18px) 24px 36px;
    }
    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transform-origin: top center;
      cursor: grab;
      user-select: none;
    }
    .page.is-panning { cursor: grabbing; }
    .page img {
      display: block;
      width: min(936px, 94vw);
      height: auto;
      background: #fff;
      box-shadow: 0 18px 50px rgba(40, 24, 8, 0.22);
      pointer-events: none;
    }

    .dock {
      position: fixed;
      right: 0; left: 0; top: 0;
      z-index: 55;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: calc(7px + env(safe-area-inset-top)) 12px 7px;
      background: rgba(28, 20, 12, 0.96);
      color: var(--parchment);
      border-bottom: 1px solid rgba(230, 200, 106, 0.22);
      backdrop-filter: blur(10px);
    }
    .dock-end {
      margin-inline-start: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-hotzone {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 22px;
      z-index: 48;
    }
    body.is-fs .header-hotzone { display: block; }
    body.is-fs .dock {
      transform: translateY(-110%);
      transition: transform 0.22s ease;
    }
    body.is-fs.header-open .dock { transform: translateY(0); }
    body.is-fs .stage { padding: 18px 24px 28px; }
    body.is-fs .player-dock { top: 10px; }
    body.is-fs.header-open .player-dock { top: calc(var(--dock-h) + 10px); }
    .perek-dd { position: relative; }
    .perek-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 220px;
      background: #1c140c;
      border: 1px solid rgba(230, 200, 106, 0.28);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 6px;
      z-index: 60;
    }
    .perek-menu.is-open { display: flex; flex-direction: column; gap: 4px; }
    .perek-item {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--parchment);
      font: 700 0.95rem "Frank Ruhl Libre", serif;
      text-align: right;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    .perek-item:hover { background: rgba(230, 200, 106, 0.14); }
    .perek-item.is-on { background: rgba(230, 200, 106, 0.24); color: #fff8dc; }
    .dock-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .mish-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
    }
    .mish-tab {
      min-width: 36px;
      height: 36px;
      padding: 0 8px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #f3e7c8;
      font: 700 1rem "Frank Ruhl Libre", "Times New Roman", serif;
      cursor: pointer;
    }
    .mish-tab.is-on {
      background: rgba(230, 200, 106, 0.28);
      color: #fff8dc;
    }
    .now-label { display: none; }
    #aidBackBtn, #aidPrintBtn { display: none; }
    body.is-aid #aidBackBtn, body.is-aid #aidPrintBtn { display: inline-flex; }
    body.is-quiz #aidBackBtn { display: inline-flex; }
    body.is-quiz .viewport { visibility: hidden; pointer-events: none; }

    .quiz-show {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      flex-direction: column;
      background: #fffdf8;
      padding-top: var(--dock-h);
    }
    .quiz-show.is-open { display: flex; }
    .quiz-show-stage {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      justify-content: center;
      padding: 18px 28px 72px;
    }
    .quiz-show-inner {
      width: min(920px, 100%);
      display: grid;
      gap: 14px;
      align-content: start;
    }
    .quiz-edit-fab {
      position: fixed;
      z-index: 76;
      left: calc(14px + env(safe-area-inset-left));
      bottom: calc(14px + env(safe-area-inset-bottom));
      display: none;
      appearance: none;
      border: 1px solid #c9a227;
      background: #fff8dc;
      color: #1c140c;
      font: 800 0.86rem "Assistant", sans-serif;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(28, 20, 12, 0.18);
    }
    body.is-quiz .quiz-edit-fab:not([hidden]) { display: inline-flex; }
    .quiz-edit-overlay {
      position: fixed; inset: 0; z-index: 80;
      display: none; align-items: flex-end; justify-content: flex-start;
      padding: 18px;
      background: rgba(18, 12, 6, 0.45);
    }
    .quiz-edit-overlay.is-open { display: flex; }
    .quiz-edit-sheet {
      width: min(560px, 100%);
      max-height: min(78vh, 720px);
      overflow: auto;
      background: #fffdf8;
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 16px 16px 18px;
      margin-bottom: 48px;
      margin-inline-start: 0;
    }
    .quiz-edit-sheet .sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 10px;
    }
    .quiz-edit-sheet h2 { margin: 0; font-size: 1.15rem; color: var(--navy); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      background: var(--overlay);
      padding: calc(var(--dock-h) + 18px) 18px 28px;
    }
    .overlay.is-open { display: flex; }
    .sheet {
      margin: auto;
      width: min(980px, 100%);
      max-height: 100%;
      overflow: auto;
      background: var(--parchment);
      color: var(--ink);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px 18px 22px;
    }
    .sheet h2 {
      margin: 0 0 14px;
      font-family: "Frank Ruhl Libre", serif;
      font-size: 1.45rem;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .toc-perek { margin-bottom: 16px; }
    .toc-perek h3 {
      margin: 0 0 8px;
      font-size: 1.02rem;
      color: var(--navy);
    }
    .toc-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .toc-btn {
      min-width: 46px;
      padding: 8px 12px;
      border: 1px solid #d8c6a0;
      border-radius: 12px;
      background: #fffdf6;
      font: 700 1rem "Frank Ruhl Libre", serif;
      cursor: pointer;
    }
    .toc-btn.is-on {
      background: #1e3a5f;
      color: #fff8dc;
      border-color: #1e3a5f;
    }

    .player-dock {
      position: fixed;
      z-index: 46;
      left: 14px;
      top: calc(var(--dock-h) + 10px);
      width: min(420px, calc(100vw - 28px));
      background: #1c140c;
      color: var(--parchment);
      border: 1px solid rgba(230, 200, 106, 0.28);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: none;
    }
    .player-dock.is-open { display: block; }
    .player-dock.is-hidden { display: none !important; }
    .player-dock header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      font-size: 0.86rem;
      font-weight: 700;
    }
    .player-dock audio {
      width: 100%;
      display: block;
      height: 42px;
      background: #140f0a;
    }
    .player-note {
      padding: 0 10px 10px;
      font-size: 0.78rem;
      opacity: 0.75;
    }
    .player-actions { display: flex; gap: 6px; }
    .song-chip {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 46;
      display: none;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 12px;
    }
    .song-chip.is-on { display: inline-flex; }

    .dropzone {
      border: 2px dashed #c9a227;
      border-radius: 16px;
      padding: 28px 16px;
      text-align: center;
      background: rgba(201, 162, 39, 0.08);
      color: #5a4718;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .dropzone.is-over { background: rgba(201, 162, 39, 0.2); }
    .save-box, .dl-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0 0 12px;
    }
    .save-box input {
      flex: 1;
      min-width: 180px;
      border: 1px solid #d8c6a0;
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
    }
    .save-ok { font-weight: 700; color: #1e3a5f; }
    .save-box:empty, .kind-pick[hidden] { display: none; }
    .kind-pick {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0 0 14px;
    }
    .kind-pick span { font-weight: 800; }
    .aid-kind {
      display: inline-block;
      margin-right: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      background: #efe3c4;
      color: #5a4718;
      font-size: 0.72rem;
    }
    .aids-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .aid-card {
      background: #fffdf6;
      border: 1px solid #e4d3ae;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      text-align: right;
      padding: 0;
      font: inherit;
      color: inherit;
    }
    .aid-card img, .aid-card video {
      width: 100%;
      height: 180px;
      object-fit: cover;
      object-position: top center;
      background: #fff;
      display: block;
    }
    .aid-card .aid-pdf {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #5a4718;
      font: 800 1.1rem "Frank Ruhl Libre", serif;
    }
    .aid-card figcaption {
      padding: 7px 9px 9px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .aid-del {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 50%;
      background: rgba(20, 15, 10, 0.72);
      color: #fff;
      cursor: pointer;
      z-index: 2;
    }
    .aid-show {
      position: fixed;
      inset: 0;
      z-index: 75;
      display: none;
      background: #efe6d4;
    }
    .aid-show.is-open { display: flex; flex-direction: column; }
    .aid-show-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #1c140c;
      color: var(--parchment);
    }
    .aid-show-tools { display: flex; align-items: center; gap: 6px; }
    .aid-show-stage {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 18px 24px 28px;
      direction: ltr;
    }
    .aid-page {
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: grab;
      user-select: none;
      transform-origin: top center;
    }
    .aid-page.is-panning { cursor: grabbing; }
    .aid-page img {
      display: block;
      width: 720px;
      height: auto;
      background: #fff;
      box-shadow: 0 18px 50px rgba(40, 24, 8, 0.22);
      pointer-events: none;
    }
    .yt-wrap {
      width: min(1100px, 94vw);
      aspect-ratio: 16 / 9;
      background: #140f0a;
      box-shadow: 0 18px 50px rgba(40, 24, 8, 0.22);
    }
    .yt-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .aid-show-stage video {
      display: block;
      width: min(1100px, 94vw);
      max-height: 86vh;
      background: #140f0a;
      box-shadow: 0 18px 50px rgba(40, 24, 8, 0.22);
    }
    .role-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .yt-row {
      display: flex;
      gap: 8px;
      margin: 0 0 14px;
    }
    .yt-row input {
      flex: 1;
      border: 1px solid #d8c6a0;
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
    }
    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      display: none;
      padding: 8px 14px;
      border-radius: 999px;
      background: #1c140c;
      color: #f3e7c8;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .toast.is-on { display: block; }
    .login-gate { z-index: 120; }
    .admin-gate { z-index: 125; }
    .login-gate, .admin-gate {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at top, rgba(230, 200, 106, 0.18), transparent 55%),
        rgba(18, 12, 6, 0.88);
      padding: 18px;
    }
    .login-gate.is-open, .admin-gate.is-open { display: flex; }
    .login-card {
      width: min(420px, 100%);
      background: var(--parchment);
      color: var(--ink);
      border-radius: 22px;
      padding: 28px 24px 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .login-card h2 {
      margin: 0 0 6px;
      font-family: "Frank Ruhl Libre", serif;
      font-size: 1.85rem;
    }
    .login-card .login-sub {
      margin: 0 0 18px;
      font-weight: 600;
      opacity: 0.78;
    }
    .login-card label {
      display: block;
      text-align: right;
      font-weight: 700;
      font-size: 0.9rem;
      margin: 0 0 5px;
    }
    .login-card .form-group { margin: 0 0 12px; text-align: right; }
    .login-card p { margin: 0 0 14px; font-weight: 600; }
    .login-card input, .login-card select {
      width: 100%;
      margin: 0;
      border: 1px solid #d8c6a0;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fff;
      box-sizing: border-box;
    }
    .login-card .primary-btn {
      width: 100%;
      margin-top: 4px;
      border: 1px solid #c9a227;
      border-radius: 12px;
      padding: 12px 14px;
      background: linear-gradient(180deg, #fff4cf, #f0d78a);
      color: #1c140c;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .login-card .primary-btn:hover { filter: brightness(1.03); }
    .login-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .login-err { color: #8a1c1c; min-height: 1.2em; margin: 0 0 8px; text-align: right; }
    .login-ok { color: #1e5a2a; min-height: 1.2em; margin: 0 0 8px; font-weight: 700; text-align: right; }
    .login-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      justify-content: center;
      margin-top: 16px;
      font-size: 0.86rem;
      font-weight: 700;
    }
    .login-links button {
      border: 0;
      background: none;
      color: #5a4718;
      text-decoration: underline;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 0;
    }
    .login-panel[hidden] { display: none !important; }
    .admin-shell {
      width: min(720px, 100%);
      max-height: min(88vh, 900px);
      overflow: auto;
      background: var(--parchment);
      color: var(--ink);
      border-radius: 22px;
      padding: 22px 20px 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .admin-shell h2 {
      margin: 0;
      font-family: "Frank Ruhl Libre", serif;
    }
    .admin-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .admin-section {
      background: #fffdf6;
      border: 1px solid #e4d3ae;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .admin-section h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: #5a4718;
    }
    .admin-section input, .admin-section select {
      width: 100%;
      margin: 0 0 8px;
      border: 1px solid #d8c6a0;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
      box-sizing: border-box;
    }
    .user-list { display: flex; flex-direction: column; gap: 6px; margin: 0; max-height: 280px; overflow: auto; }
    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #e4d3ae;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      font-weight: 700;
      color: inherit;
      width: 100%;
      text-align: right;
    }
    .user-row .user-meta { opacity: 0.7; font-size: 0.82rem; }
    .admin-tools { display: flex; gap: 6px; flex-wrap: wrap; }
    .key-btn {
      position: fixed;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 130;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(230, 200, 106, 0.4);
      border-radius: 50%;
      background: rgba(28, 20, 12, 0.92);
      color: #f3e7c8;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .user-chip { font-size: 0.78rem; font-weight: 700; opacity: 0.85; }
    @media (max-width: 820px) {
      .page img { width: 92vw; }
      .brand-logo { width: 34px; }
    }
  </style>
</head>
<body>

        if (!req) {
          document.body.classList.add("fs-fallback");
          syncFs();
          return;
        }
        Promise.resolve(req.call(root)).then(syncFs).catch(function () {
          document.body.classList.add("fs-fallback");
          syncFs();
        });
      } else {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) {
          Promise.resolve(exit.call(document)).finally(function () {
            document.body.classList.remove("fs-fallback");
            syncFs();
          });
        } else {
          document.body.classList.remove("fs-fallback");

        win.print();
      }
      if (!left) {
        go();
        return;
      }
      Array.prototype.forEach.call(list, function (img) {
        if (img.complete) {
          left -= 1;

    function youtubeIdFromUrl(url) {
      url = String(url || "").replace(/[\u200e\u200f\u202a-\u202e]/g, "").trim();
      if (/^[\w-]{11}$/.test(url)) return url;
      var patterns = [
        /youtu\.be\/([\w-]{11})/i,
        /youtube(?:-nocookie)?\.com\/(?:embed|shorts|live)\/([\w-]{11})/i,
        /youtube(?:-nocookie)?\.com\/watch\?[^#]*\bv=([\w-]{11})/i,
        /[?&]v=([\w-]{11})/i,
        /\/([\w-]{11})(?:[?&#]|$)/i
      ];
      for (var i = 0; i < patterns.length; i++) {
        var found = url.match(patterns[i]);
        if (found) return found[1];
      }
      return "";
    }
    function readLocalLinks() {
      try { return JSON.parse(localStorage.getItem(ytStorageKey()) || "[]"); } catch (e) { return []; }
    }
    var sessionItems = [];
    function writeLocalLinks(list) {
      try { localStorage.setItem(ytStorageKey(), JSON.stringify(list)); } catch (e) {}
    }
    function addYoutubeLink(url) {
      var user = currentUser();
      if (!user) {
        showToast("צריך להתחבר כמורה");
        return;
      }
      var vid = youtubeIdFromUrl(url);
      if (!vid) {
        showToast("לא זוהה קישור יוטיוב. הדביקו קישור מלא");
        return;
      }
      var here = current();
      if (readLocalLinks().some(function (row) { return row.youtubeId === vid && belongsToCurrent(row); })) {
        showToast("הסרטון כבר שמור למשנה הזו");
        return;
      }
      var item = {
        id: "yt-" + vid + "-" + Date.now(),
        username: user,
        name: "סרטון יוטיוב",
        role: "סרטונים",
        kind: "סרטון",
        type: "youtube",
        youtubeId: vid,
        url: "https://www.youtube.com/watch?v=" + vid,
        perek: here.perek,
        mish: here.mish,
        personal: true
      };
      writeLocalLinks(readLocalLinks().concat([item]));
      document.getElementById("ytUrl").value = "";
      function finish() {
        showToast("נשמר");
        openAid(item);
      }
      sessionItems.push(item);
      var save = window.BerakhotAccounts ? BerakhotAccounts.saveFile(item) : Promise.resolve();
      save.then(function () {
        if (isAdmin() && window.BerakhotStore && BerakhotStore.canSave()) {
          return BerakhotStore.addYoutube(here.perek, vid, item.name, here.mish).catch(function () {});
        }
      }).then(finish).catch(finish);
    }
    function belongsToCurrent(row) {
      var here = current();
      if (Number(row.perek) !== here.perek) return false;
      if (Number(row.mish) === here.mish) return true;
      var list = row.mishnayot || [];
      return list.some(function (n) { return Number(n) === here.mish; });
    }
    function loadMaterials() {
      var here = current();
      var user = currentUser();
      function withLocal(items) {
        items = items ? items.slice().filter(belongsToCurrent) : [];
        function mergeRow(row) {
          if (!belongsToCurrent(row)) return;
          if (items.some(function (x) { return (x.id && x.id === row.id) || (x.youtubeId && x.youtubeId === row.youtubeId); })) return;
          items.push(row);
        }
        sessionItems.concat(readLocalLinks()).forEach(mergeRow);
        items.forEach(function (row) {
          if (row.pages) row.pages = row.pages.map(function (src) { return typeof src === "string" ? asset(src) : src; });
          if (row.file && typeof row.file === "string") row.file = asset(row.file);
        });
        if (!window.BerakhotAccounts || !user) return Promise.resolve({ items: items });
        return BerakhotAccounts.userFiles(user).then(function (personal) {
          personal.forEach(function (row) { mergeRow(hydratePersonal(row)); });
          return { items: items };
        }).catch(function () { return { items: items }; });
      }
      return fetch(materialsUrl()).then(function (res) {
        if (!res.ok) throw new Error("api");
        return res.json();
      }).catch(function () {
        return fetch(asset("חומרים/רישום.json")).then(function (res) {
          if (!res.ok) throw new Error("registry");
          return res.json();
        }).then(function (data) {
          return { items: (data.items || []).filter(belongsToCurrent) };
        });
      }).then(function (data) {
        return withLocal(data && data.items);
      }).catch(function () {
        return withLocal([]);
      });
    }
    function renderAids() {
      var grid = document.getElementById("aidsGrid");
      loadMaterials().then(function (data) {
        var rows = data.items || [];
        grid.innerHTML = "";
        if (!rows.length) {
          grid.innerHTML = "<p style='grid-column:1/-1;opacity:.7'>אין עזרים למשנה הזו.</p>";
          return;
        }
        rows.forEach(function (row) {
          var card = document.createElement("button");
          card.type = "button";
          card.className = "aid-card";
          if (row.type === "youtube") {
            var thumb = document.createElement("img");
            thumb.alt = "";
            thumb.src = "https://img.youtube.com/vi/" + row.youtubeId + "/hqdefault.jpg";
            thumb.onerror = function () {
              var pdf = document.createElement("div");
              pdf.className = "aid-pdf";
              pdf.textContent = "יוטיוב";
              thumb.replaceWith(pdf);
            };
            card.appendChild(thumb);
          } else if (row.type === "video") {
            var media = document.createElement("video");
            media.src = row.file;
            media.muted = true;
            card.appendChild(media);
          } else if (row.pages && row.pages[0]) {
            var img = document.createElement("img");
            img.alt = "";
            img.src = row.pages[0];
            card.appendChild(img);
          } else {
            var mark = document.createElement("div");
            mark.className = "aid-pdf";
            mark.textContent = kindOf(row);
            card.appendChild(mark);
          }
          var cap = document.createElement("figcaption");
          var badge = document.createElement("span");
          badge.className = "aid-kind";
          badge.textContent = kindOf(row);
          cap.appendChild(badge);
          cap.appendChild(document.createTextNode(row.name || ""));
          var del = document.createElement("button");
          del.className = "aid-del";
          del.type = "button";
          del.textContent = "×";
          del.onclick = function (e) {
            e.stopPropagation();
            var done = function () { renderAids(); };
            if (row.youtubeId) {
              writeLocalLinks(readLocalLinks().filter(function (x) { return x.id !== row.id && x.youtubeId !== row.youtubeId; }));
            }
            if (row.personal || (row.username && row.username === currentUser())) {
              if (window.BerakhotAccounts) {
                BerakhotAccounts.deleteFile(row.id).then(done).catch(done);
              } else {
                done();
              }
              return;
            }
            if (isAdmin() && window.BerakhotStore && BerakhotStore.canSave()) {
              BerakhotStore.removeItem(row).then(done).catch(function () {
                showToast("המחיקה מהאתר נכשלה");
                done();
              });
              return;
            }
            showToast("אפשר למחוק רק עזרים שהוספתם");
          };
          card.appendChild(cap);
          card.appendChild(del);
          card.onclick = function () { openAid(row); };
          grid.appendChild(card);
        });
      }).catch(function () {
        showToast("יש לפתוח את התוכנה דרך פתח.bat כדי לשמור עזרים בתיקייה");
      });
    }
    function hideKindPick() {

    function askKind(files) {
      var list = Array.from(files || []).filter(function (f) {
        var type = (f.type || "").toLowerCase();
        var name = (f.name || "").toLowerCase();
        return type.indexOf("image/") === 0 || type.indexOf("video/") === 0 || type.indexOf("pdf") !== -1 || name.slice(-4) === ".pdf";
      });
      if (!list.length) {
        showToast("אפשר לגרור תמונות, סרטונים או קובצי PDF");
        return;
      }
      pendingFiles = list;
      document.getElementById("kindPick").hidden = false;

    function addFiles(files, kind) {
      var item = current();
      var user = currentUser();
      if (!user) {
        showToast("צריך להתחבר כמורה");
        return;
      }
      var list = Array.from(files || []);
      if (!list.length || !KIND_ROLE[kind]) {
        showToast("בחרו סוג לשמירה");
        return;
      }
      aidRole = KIND_ROLE[kind];
      var chain = Promise.resolve();
      list.forEach(function (file) {
        chain = chain.then(function () {
          return BerakhotAccounts.fileToPages(file).then(function (parsed) {
            var row = {
              id: "u-" + user + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7),
              username: user,
              name: file.name,
              role: aidRole,
              kind: kind,
              type: parsed.type === "video" ? "video" : (parsed.type === "pages" ? "pages" : "file"),
              perek: item.perek,
              mish: item.mish,
              pages: parsed.pages,
              fileBlob: parsed.fileBlob,
              personal: true
            };
            return BerakhotAccounts.saveFile(row).then(function () {
              if (isAdmin() && window.BerakhotStore && BerakhotStore.canSave()) {
                return BerakhotStore.uploadFile(item.perek, aidRole, file, item.mish).then(function (saved) {
                  if (saved) sessionItems.push(saved);
                }).catch(function () {});
              }
            });
          });
        });
      });
      chain.then(function () {
        hideKindPick();
        renderAids();
        showToast("נשמר");
      }).catch(function (err) {
        if (err && err.message === "type") showToast("אפשר לגרור תמונות, סרטונים או קובצי PDF");
        else showToast("השמירה נכשלה");
      });
    }

    function migrateBrowserAids() {
      if (localStorage.getItem("berakhot-aids-migrated") || !window.indexedDB) return;
      ["berakhot-aids", "mishnah-aids", "aids"].forEach(function (dbName) {
        var open = indexedDB.open(dbName);
        open.onerror = function () {};
        open.onsuccess = function () {
          var db = open.result;
          var names = Array.from(db.objectStoreNames || []);
          if (!names.length) { db.close(); return; }
          try {
            var req = db.transaction(names[0], "readonly").objectStore(names[0]).getAll();
            req.onsuccess = function () {
              var rows = req.result || [];
              var jobs = rows.map(function (row) {
                var blob = row.blob || row.file || row.data;
                var name = row.name || row.filename || "עזר שמור";
                if (!blob || typeof blob === "string") return null;
                var file = blob instanceof File ? blob : new File([blob], name, { type: blob.type || "application/octet-stream" });
                var body = new FormData();
                body.append("perek", String(row.perek || current().perek || 1));
                body.append("mish", String(row.mish || 1));
                body.append("role", row.role === "מבחנים" ? "מבחנים" : "עזרים");
                body.append("file", file, file.name);
                return fetch("/api/upload", { method: "POST", body: body });
              }).filter(Boolean);
              Promise.all(jobs).then(function () {
                localStorage.setItem("berakhot-aids-migrated", "1");
                db.close();
              }).catch(function () { db.close(); });
            };
          } catch (e) {
            db.close();
          }
        };
      });
    }
