<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הפנימים והחיצונים</title>
<style>
  :root {
    --ink: #2a241b;
    --paper: rgba(251,247,239,.92);
    --line: #d7cbb8;
    --accent: #6b4f2a;
    --ui: "Assistant", "Heebo", "Segoe UI", "Arial", "Tahoma", sans-serif;
    --ser: "Frank Ruhl Libre", "David Libre", "David", "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #e9dfcd;
    color: var(--ink);
    font-family: var(--ui);
  }
  canvas { display: block; width: 100%; height: 100%; cursor: default; }
  .bar {
    position: absolute; top: 0; right: 0; left: 0;
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 28px 0; pointer-events: none;
  }
  .bar h1 {
    margin: 0; font-family: var(--ser);
    font-size: clamp(18px, 1.6vw, 26px); font-weight: 700;
    color: var(--accent); text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  .bar span { font-size: 13px; color: #7a7166; font-weight: 600; }
  .controls {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 10px 6px 14px;
    box-shadow: 0 8px 24px rgba(60,45,20,.12); direction: rtl;
  }
  button, select {
    font-family: var(--ui); font-size: 15px; font-weight: 700;
    border: 0; background: transparent; color: var(--ink);
    padding: 6px 11px; border-radius: 999px; cursor: pointer;
  }
  button:hover, select:hover { background: #efe7d8; }
  button.primary { background: var(--accent); color: #fffaf3; }
  button.primary:hover { filter: brightness(1.08); }
  .legend {
    position: absolute; bottom: 18px; right: 22px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 12px; font-size: 13px;
    font-weight: 700; color: #4a433a;
    box-shadow: 0 6px 18px rgba(60,45,20,.1);
    line-height: 1.7; user-select: none;
  }
  .legend.hidden { display: none; }
  .dot {
    display: inline-block; width: 11px; height: 11px; border-radius: 50%;
    margin-left: 6px; vertical-align: -1px; box-shadow: 0 0 0 1px rgba(0,0,0,.08);
  }
  .hidel {
    position: absolute; bottom: 22px; right: 22px;
    font-family: var(--ui); font-size: 13px; font-weight: 700; color: #6b4f2a;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(60,45,20,.1);
  }
  .hidel.hidden { display: none; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="bar">
    <h1>הפנימים והחיצונים</h1>
    <span>משנה ברכות ג, ב</span>
  </div>
  <div class="legend" id="legend" title="לחצו להסתרה">
    <div><i class="dot" style="background:#6b4a58"></i>אבלים</div>
    <div><i class="dot" style="background:#d4892a"></i>פנימים – רואים את פני האבלים</div>
    <div><i class="dot" style="background:#7d9a74"></i>חיצונים – אינם רואים את הפנים</div>
  </div>
  <button type="button" class="hidel hidden" id="showLeg">מקרא</button>
  <div class="controls">
    <button type="button" class="primary" id="btnPlay">⏸ השהיה</button>
    <button type="button" id="btnRestart">התחלה</button>
    <label style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px">קצב
      <select id="speed">
        <option value="0.6">איטי</option>
        <option value="1" selected>רגיל</option>
        <option value="1.5">מהיר</option>
        <option value="2">מהיר מאוד</option>
      </select>
    </label>
  </div>

<script>
(function () {
  const COL = {
    mourner: [0x6b, 0x4a, 0x58],
    inner:   [0xd4, 0x89, 0x2a],
    outer:   [0x7d, 0x9a, 0x74]
  };
  const N_MOURN = 6;
  const N_ROWS = 5;         // 0 = front row, along the mourners
  const SPACING = 24;
  const ROW_GAP = 36;
  const AISLE = 40;
  const MOURN_Y = 96;
  const MOURN_GAP = 26;
  const R = 7.6;
  const RM = 8.8;
  const VIEW_W = 680;
  const WALK = 52;
  const CAM_Y = 8;
  const X_LEFT = -248;
  const X_RIGHT = 196;
  const X_EXIT = 400;       // past the right edge of the view
  const X_ENTER = -400;     // past the left edge of the view

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const btnPlay = document.getElementById("btnPlay");
  const btnRestart = document.getElementById("btnRestart");
  const speedEl = document.getElementById("speed");
  const legendEl = document.getElementById("legend");
  const showLeg = document.getElementById("showLeg");

  let W = 0, H = 0, dpr = 1, scale = 1;
  let playing = true, speed = 1, time = 0;
  let people = [], mourners = [], comforters = [];
  let path = [], pathLen = 0, frontS = 0;
  let idSeq = 1, seed = 1;

  function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
  function rgb(c, a) {
    return a == null ? "rgb(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + ")"
                     : "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + a + ")";
  }
  function sx(x) { return x * scale + W * 0.5; }
  function sy(y) { return (y - CAM_Y) * scale + H * 0.52; }
  function rowY(row) { return (MOURN_Y - AISLE) - row * ROW_GAP; }

  function wrapS(s) {
    const L = pathLen;
    s = s % L;
    if (s < 0) s += L;
    return s;
  }

  function buildPath() {
    path = [];
    let s = 0, last = null;
    function push(x, y, isFront) {
      if (last) {
        const ds = Math.hypot(x - last.x, y - last.y);
        if (ds < 0.35) return;
        s += ds;
      }
      path.push({ x: x, y: y, s: s, isFront: !!isFront, face: 0 });
      last = path[path.length - 1];
    }
    function lineTo(x1, y1, isFront) {
      const x0 = last ? last.x : x1, y0 = last ? last.y : y1;
      const len = Math.hypot(x1 - x0, y1 - y0);
      const n = Math.max(1, Math.ceil(len / 2));
      for (let i = 1; i <= n; i++) {
        const t = i / n;
        push(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, isFront);
      }
    }
    // Semicircle at the right: from (X_RIGHT, y0) going +x to (X_RIGHT, y1) going -x
    function arcRight(y0, y1) {
      const cy = (y0 + y1) / 2, R = Math.abs(y1 - y0) / 2;
      const n = Math.max(10, Math.ceil(Math.PI * R / 2));
      for (let i = 1; i <= n; i++) {
        const th = -Math.PI / 2 + Math.PI * (i / n);
        push(X_RIGHT + R * Math.cos(th), cy + R * Math.sin(th), false);
      }
    }
    // Semicircle at the left: from (X_LEFT, y0) going -x to (X_LEFT, y1) going +x
    function arcLeft(y0, y1) {
      const cy = (y0 + y1) / 2, R = Math.abs(y1 - y0) / 2;
      const n = Math.max(10, Math.ceil(Math.PI * R / 2));
      for (let i = 1; i <= n; i++) {
        const th = -Math.PI / 2 - Math.PI * (i / n);
        push(X_LEFT + R * Math.cos(th), cy + R * Math.sin(th), false);
      }
    }

    const yBack = rowY(N_ROWS - 1);
    push(X_ENTER, yBack, false);
    // Back row is even-indexed when N_ROWS is odd (row 4 of 0..4): goes right, like the front
    for (let row = N_ROWS - 1; row >= 0; row--) {
      const y = rowY(row);
      const goingRight = (row % 2 === 0);
      const isFront = (row === 0);
      if (row === N_ROWS - 1) {
        lineTo(goingRight ? X_RIGHT : X_LEFT, y, false);
      } else {
        // just arrived via U-turn at the start of this row
        lineTo(goingRight ? (isFront ? X_EXIT : X_RIGHT) : X_LEFT, y, isFront);
      }
      if (row === 0) break;
      const yNext = rowY(row - 1);
      if (goingRight) arcRight(y, yNext);
      else arcLeft(y, yNext);
    }

    pathLen = path[path.length - 1].s;
    // Tangents / travel facing
    for (let i = 0; i < path.length; i++) {
      const a = path[i === 0 ? 0 : i - 1];
      const b = path[i === path.length - 1 ? i : i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      path[i].face = Math.atan2(dy, dx);
    }
    // Front-row start (first point marked isFront)
    frontS = pathLen;
    for (let i = 0; i < path.length; i++) {
      if (path[i].isFront) { frontS = path[i].s; break; }
    }
  }

  function atS(s) {
    s = wrapS(s);
    let lo = 0, hi = path.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (path[mid].s < s) lo = mid + 1;
      else hi = mid;
    }
    const i = Math.max(1, lo);
    const a = path[i - 1], b = path[i];
    const span = b.s - a.s || 1;
    const t = (s - a.s) / span;
    const x = lerp(a.x, b.x, t);
    const y = lerp(a.y, b.y, t);
    // shortest-arc face lerp
    let fa = a.face, fb = b.face, d = fb - fa;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    let face = fa + d * t;
    const isFront = (s >= frontS);
    // On the front row, turn to face the mourners (down, +y)
    if (isFront) {
      const blend = Math.min(1, (s - frontS) / 22);
      let fm = Math.PI / 2, df = fm - face;
      while (df > Math.PI) df -= Math.PI * 2;
      while (df < -Math.PI) df += Math.PI * 2;
      face = face + df * blend;
    }
    return { x: x, y: y, face: face, isFront: isFront, s: s };
  }

  function reset() {
    seed = 12345;
    idSeq = 1;
    time = 0;
    people = [];
    mourners = [];
    comforters = [];
    buildPath();

    for (let i = 0; i < N_MOURN; i++) {
      const p = {
        id: idSeq++, kind: "mourner",
        x: (i - (N_MOURN - 1) / 2) * MOURN_GAP,
        y: MOURN_Y,
        face: -Math.PI / 2,
        phase: 0,
        r: RM,
        isFront: false
      };
      mourners.push(p);
      people.push(p);
    }

    const n = Math.round(pathLen / SPACING);
    for (let i = 0; i < n; i++) {
      const p = {
        id: idSeq++, kind: "comforter",
        index: i,
        s: 0, x: 0, y: 0, face: 0,
        isFront: false, colorT: 0,
        phase: rand() * Math.PI * 2,
        r: R + (rand() - 0.5) * 0.4
      };
      comforters.push(p);
      people.push(p);
    }
    place(0);
  }

  function place(t) {
    const head = WALK * t;
    const n = comforters.length;
    for (let i = 0; i < n; i++) {
      const p = comforters[i];
      // i=0 is nearest the exit (head of the queue)
      p.s = wrapS(head - i * SPACING);
      const q = atS(p.s);
      p.x = q.x;
      p.y = q.y;
      p.face = q.face;
      p.isFront = q.isFront;
      p.colorT = q.isFront ? 1 : 0;
    }
    for (let i = 0; i < mourners.length; i++) {
      const m = mourners[i];
      m.x = (i - (N_MOURN - 1) / 2) * MOURN_GAP;
      m.y = MOURN_Y;
      m.face = -Math.PI / 2;
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = W / VIEW_W;
  }

  function tick(dt) {
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    time += dt;
    place(time);
    for (let i = 0; i < comforters.length; i++) comforters[i].phase += dt * 7;
  }

  function roleColor(p) {
    if (p.kind === "mourner") return COL.mourner;
    return p.isFront ? COL.inner : COL.outer;
  }

  function drawPath() {
    if (path.length < 2) return;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(sx(path[0].x), sy(path[0].y));
    for (let i = 1; i < path.length; i++) ctx.lineTo(sx(path[i].x), sy(path[i].y));
    ctx.strokeStyle = "rgba(93,69,36,0.22)";
    ctx.lineWidth = Math.max(2, 3.2 * scale);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,248,235,0.28)";
    ctx.lineWidth = Math.max(1, 1.4 * scale);
    ctx.stroke();
    ctx.restore();
  }

  function drawPerson(p) {
    const bob = p.kind === "mourner" ? 0 : Math.sin(p.phase) * 0.9;
    const x = sx(p.x), y = sy(p.y) + bob;
    const c = roleColor(p);
    const rr = (p.r + (p.kind === "mourner" ? 0.7 : 0)) * scale;
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.ellipse(0, rr * 0.8, rr * 0.95, rr * 0.38, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(70,50,25,0.22)";
    ctx.fill();
    if (p.kind === "mourner") {
      ctx.beginPath();
      ctx.arc(0, -1, rr + 4, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(107,74,88,0.22)";
      ctx.fill();
    } else if (p.isFront) {
      ctx.beginPath();
      ctx.arc(0, -1, rr + 4, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(212,137,42,0.20)";
      ctx.fill();
    }
    const lite = mix(c, [255, 245, 225], 0.35);
    const dark = mix(c, [40, 30, 20], 0.22);
    const g = ctx.createRadialGradient(-rr * 0.28, -rr * 0.42, 1, 0, 0, rr);
    g.addColorStop(0, rgb(lite));
    g.addColorStop(0.55, rgb(c));
    g.addColorStop(1, rgb(dark));
    ctx.beginPath();
    ctx.arc(0, -1, rr, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = Math.max(1, 1.1 * scale * 0.5);
    ctx.strokeStyle = rgb(dark, 0.8);
    ctx.stroke();
    const fx = Math.cos(p.face) * (rr * 0.62);
    const fy = Math.sin(p.face) * (rr * 0.62) - 1;
    ctx.beginPath();
    ctx.arc(fx, fy, Math.max(2.1, rr * 0.28), 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,248,235,0.95)";
    ctx.fill();
    ctx.strokeStyle = "rgba(80,55,30,0.35)";
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.restore();
  }

  function drawGround() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#efe6d4");
    bg.addColorStop(0.5, "#e6d8be");
    bg.addColorStop(1, "#deceb0");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    const topY = sy(rowY(N_ROWS - 1) - ROW_GAP * 0.7);
    const botY = sy(MOURN_Y + 28);
    const y0 = Math.min(topY, botY), y1 = Math.max(topY, botY);
    ctx.fillStyle = "#c4b193";
    ctx.fillRect(0, y0, W, y1 - y0);
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    ctx.fillRect(0, y0, W, 9);
    ctx.fillStyle = "rgba(80,55,25,0.10)";
    ctx.fillRect(0, y1 - 9, W, 9);
    ctx.strokeStyle = "rgba(93,69,36,0.28)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, y0); ctx.lineTo(W, y0);
    ctx.moveTo(0, y1); ctx.lineTo(W, y1);
    ctx.stroke();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawGround();
    drawPath();
    const arr = people.slice().sort(function (a, b) { return a.y - b.y; });
    for (let i = 0; i < arr.length; i++) drawPerson(arr[i]);
  }

  const STEP = 1 / 60;
  let acc = 0, last = performance.now(), raf = 0;

  function loop(now) {
    raf = requestAnimationFrame(loop);
    const raw = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (playing) {
      acc += raw * speed;
      while (acc >= STEP) { tick(STEP); acc -= STEP; }
    }
    render();
  }

  function minDistAndOverlaps() {
    let minD = 1e9, overlaps = 0;
    for (let i = 0; i < people.length; i++)
      for (let j = i + 1; j < people.length; j++) {
        const d = Math.hypot(people[i].x - people[j].x, people[i].y - people[j].y);
        if (d < minD) minD = d;
        if (d < (people[i].r + people[j].r) * 0.7) overlaps++;
      }
    return { minDist: minD, overlaps: overlaps };
  }

  function getState() {
    const md = minDistAndOverlaps();
    const half = VIEW_W / 2;
    let nAmber = 0, nSage = 0, nOffRight = 0, nOffLeft = 0, sumS = 0, sumX = 0;
    let minX = 1e9, maxX = -1e9;
    const samples = [];
    for (let i = 0; i < comforters.length; i++) {
      const p = comforters[i];
      sumS += p.s;
      sumX += p.x;
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.isFront) nAmber++; else nSage++;
      if (p.x > half) nOffRight++;
      if (p.x < -half) nOffLeft++;
    }
    // Track a few people near the front-row entry and the exit
    const tracked = [0, 1, Math.max(0, nAmber - 1), nAmber, nAmber + 1].filter(function (i, k, a) {
      return i >= 0 && i < comforters.length && a.indexOf(i) === k;
    }).map(function (i) {
      const p = comforters[i];
      return { i: i, id: p.id, s: +p.s.toFixed(2), x: +p.x.toFixed(2), y: +p.y.toFixed(2), amber: p.isFront };
    });
    return {
      time: time,
      playing: playing,
      pathLen: pathLen,
      frontS: frontS,
      headS: comforters.length ? comforters[0].s : 0,
      meanS: comforters.length ? sumS / comforters.length : 0,
      meanX: comforters.length ? sumX / comforters.length : 0,
      minX: minX,
      maxX: maxX,
      nAmber: nAmber,
      nSage: nSage,
      nOffRight: nOffRight,
      nOffLeft: nOffLeft,
      nMourners: mourners.length,
      people: people.length,
      nComforters: comforters.length,
      mournerX: mourners.map(function (m) { return +m.x.toFixed(2); }),
      mournerY: mourners.map(function (m) { return +m.y.toFixed(2); }),
      minDist: md.minDist,
      overlaps: md.overlaps,
      tracked: tracked,
      walk: WALK
    };
  }

  function setPlaying(v) {
    playing = !!v;
    btnPlay.textContent = playing ? "⏸ השהיה" : "▶ הפעלה";
    if (playing) last = performance.now();
  }

  btnPlay.addEventListener("click", function () { setPlaying(!playing); });
  btnRestart.addEventListener("click", function () {
    reset(); acc = 0; last = performance.now(); render();
  });
  speedEl.addEventListener("change", function () { speed = parseFloat(speedEl.value); });
  legendEl.addEventListener("click", function () {
    legendEl.classList.add("hidden");
    showLeg.classList.remove("hidden");
  });
  showLeg.addEventListener("click", function () {
    showLeg.classList.add("hidden");
    legendEl.classList.remove("hidden");
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === " " || ev.code === "Space") { ev.preventDefault(); setPlaying(!playing); }
    else if (ev.key === "Home" || ev.key === "r" || ev.key === "R") {
      reset(); acc = 0; last = performance.now(); render();
    }
  });
  window.addEventListener("resize", function () { resize(); render(); });
  document.addEventListener("visibilitychange", function () {
    last = performance.now();
  });

  window.Sim = {
    play: function () { setPlaying(true); },
    pause: function () { setPlaying(false); },
    restart: function () { reset(); acc = 0; last = performance.now(); render(); },
    setSpeed: function (v) { speed = v; speedEl.value = String(v); },
    tick: function (dt) { tick(dt); render(); },
    stepFixed: function (n) { for (let i = 0; i < n; i++) tick(STEP); render(); },
    getState: getState,
    frameJPEG: function (q) { return canvas.toDataURL("image/jpeg", q || 0.88); },
    get time() { return time; }
  };

  resize();
  reset();
  render();
  setPlaying(true);
  last = performance.now();
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
