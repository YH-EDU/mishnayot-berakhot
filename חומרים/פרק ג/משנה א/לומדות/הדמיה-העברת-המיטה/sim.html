<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לפני המיטה ולאחר המיטה</title>
<style>
  :root {
    --ink: #2a241b;
    --paper: rgba(251,247,239,.92);
    --line: #d7cbb8;
    --accent: #6b4f2a;
    --ui: "Assistant", "Heebo", "Segoe UI", "Arial", "Tahoma", sans-serif;
    --ser: "Frank Ruhl Libre", "David Libre", "David", "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #e9dfcd;
    color: var(--ink);
    font-family: var(--ui);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: default;
  }
  .bar {
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 28px 0;
    pointer-events: none;
  }
  .bar h1 {
    margin: 0;
    font-family: var(--ser);
    font-size: clamp(18px, 1.6vw, 26px);
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  .bar span {
    font-size: 13px;
    color: #7a7166;
    font-weight: 600;
  }
  .controls {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 10px 6px 14px;
    box-shadow: 0 8px 24px rgba(60,45,20,.12);
    direction: rtl;
  }
  button, select {
    font-family: var(--ui);
    font-size: 15px;
    font-weight: 700;
    border: 0;
    background: transparent;
    color: var(--ink);
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
  }
  button:hover, select:hover { background: #efe7d8; }
  button.primary {
    background: var(--accent);
    color: #fffaf3;
  }
  button.primary:hover { filter: brightness(1.08); }
  select { font-weight: 700; }
  .legend {
    position: absolute;
    bottom: 18px;
    right: 22px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    color: #4a433a;
    box-shadow: 0 6px 18px rgba(60,45,20,.1);
    line-height: 1.7;
    user-select: none;
  }
  .legend.hidden { display: none; }
  .legend button.toggle {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .dot {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    margin-left: 6px;
    vertical-align: -1px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.08);
  }
  .hidel {
    position: absolute;
    bottom: 22px;
    right: 22px;
    font-family: var(--ui);
    font-size: 13px;
    font-weight: 700;
    color: #6b4f2a;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(60,45,20,.1);
  }
  .hidel.hidden { display: none; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="bar">
    <h1>לפני המיטה ולאחר המיטה</h1>
    <span>משנה ברכות ג, א</span>
  </div>
  <div class="legend" id="legend" title="לחצו להסתרה">
    <div><i class="dot" style="background:#4f74a3"></i>עוד לפני המיטה</div>
    <div><i class="dot" style="background:#d4892a"></i>נושאים</div>
    <div><i class="dot" style="background:#7d9a74"></i>כבר נשאו – לאחר המיטה</div>
  </div>
  <button type="button" class="hidel hidden" id="showLeg">מקרא</button>
  <div class="controls">
    <button type="button" class="primary" id="btnPlay">⏸ השהיה</button>
    <button type="button" id="btnRestart">התחלה</button>
    <label style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px">קצב
      <select id="speed">
        <option value="0.6">איטי</option>
        <option value="1" selected>רגיל</option>
        <option value="1.5">מהיר</option>
        <option value="2">מהיר מאוד</option>
      </select>
    </label>
  </div>

<script>
(function () {
  const COL = {
    ahead:  [0x4f, 0x74, 0xa3],
    bearer: [0xd4, 0x89, 0x2a],
    behind: [0x7d, 0x9a, 0x74],
    wood: "#8d6a3d",
    woodDark: "#5d4524",
    woodLite: "#c4a06a"
  };
  const LANES = 7;
  const LANE_GAP = 34;
  const WALK = 42;
  const ST_W = 58;
  const ST_H = 24;
  const SLOT_X = 22;
  const SLOT_Y = 20;
  const PASS = 28;
  const HAND_EVERY = 2.3;
  const HAND_DUR = 0.9;
  const R = 8.2;
  const COLS = 10;
  const GAP = 32;
  const VIEW_W = 580;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const btnPlay = document.getElementById("btnPlay");
  const btnRestart = document.getElementById("btnRestart");
  const speedEl = document.getElementById("speed");
  const legendEl = document.getElementById("legend");
  const showLeg = document.getElementById("showLeg");

  let W = 0, H = 0, dpr = 1, scale = 1;
  let playing = true, speed = 1, time = 0, camX = 0;
  let people = [], bearers = [];
  let stretcher = { x: 0, y: 0 };
  let handover = null, nextHand = 1.15, handovers = 0;
  let idSeq = 1, seed = 1;

  function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function nrand() { return (rand() + rand() + rand() - 1.5) * 0.75; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function ease(t) { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function rgb(c, a) {
    return a == null ? "rgb(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + ")"
                     : "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + a + ")";
  }
  function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
  function laneY(i) { return (i - (LANES - 1) / 2) * LANE_GAP; }
  function slotsAt(x, y) {
    return [
      { x: x + SLOT_X, y: y - SLOT_Y },
      { x: x + SLOT_X, y: y + SLOT_Y },
      { x: x - SLOT_X, y: y - SLOT_Y },
      { x: x - SLOT_X, y: y + SLOT_Y }
    ];
  }
  function sx(x) { return (x - camX) * scale + W * 0.5; }
  function sy(y) { return y * scale + H * 0.52; }

  function makePerson(x, lane, role) {
    return {
      id: idSeq++,
      x: x, y: laneY(lane) + nrand() * 4,
      lane: lane, role: role,
      colorT: role === "behind" ? 1 : 0,
      phase: rand() * Math.PI * 2,
      spd: 0.985 + rand() * 0.03,
      slow: 0,
      r: R + (rand() - 0.5) * 0.8
    };
  }

  function reset() {
    seed = 12345;
    idSeq = 1;
    time = 0;
    handovers = 0;
    handover = null;
    nextHand = 1.85;
    stretcher.x = 0;
    stretcher.y = 0;
    people = [];
    const startSlots = slotsAt(0, 0);
    bearers = [];
    for (let s = 0; s < 4; s++) {
      const lane = s % 2 === 0 ? 2 : 4;
      const p = makePerson(startSlots[s].x, lane, "bearer");
      p.x = startSlots[s].x;
      p.y = startSlots[s].y;
      p.spd = 1;
      people.push(p);
      bearers.push(p);
    }
    // Tight rectangular procession. Stretcher sits in column 3 of 10
    // so both "ahead" and "behind" are visible at once.
    const startCol = 3;
    const center = Math.floor(LANES / 2);
    for (let col = 0; col < COLS; col++) {
      for (let lane = 0; lane < LANES; lane++) {
        if (lane === center) continue; // aisle for the stretcher
        const x = (col - startCol) * GAP + nrand() * 5;
        const y = laneY(lane);
        let close = false;
        for (const sl of startSlots) {
          if (Math.hypot(x - sl.x, y - sl.y) < 18) close = true;
        }
        if (close) continue;
        const role = x > 12 ? "ahead" : "behind";
        people.push(makePerson(x, lane, role));
      }
    }
    camX = 0;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = W / VIEW_W;
  }

  function pickNewBearers() {
    const targetSlots = slotsAt(stretcher.x + PASS, stretcher.y);
    const used = new Set(bearers.map(function (b) { return b.id; }));
    const chosen = [];
    for (let s = 0; s < targetSlots.length; s++) {
      const sl = targetSlots[s];
      let best = null, bestD = 1e9;
      for (let i = 0; i < people.length; i++) {
        const p = people[i];
        if (used.has(p.id) || p.role !== "ahead") continue;
        if (p.x < stretcher.x + 4) continue;
        const d = (p.x - sl.x) * (p.x - sl.x) * 1.15 + (p.y - sl.y) * (p.y - sl.y);
        if (d < bestD) { bestD = d; best = p; }
      }
      if (!best) {
        for (let i = 0; i < people.length; i++) {
          const p = people[i];
          if (used.has(p.id) || p.role === "bearer") continue;
          if (p.x < stretcher.x) continue;
          const d = (p.x - sl.x) * (p.x - sl.x) + (p.y - sl.y) * (p.y - sl.y);
          if (d < bestD) { bestD = d; best = p; }
        }
      }
      if (best) { used.add(best.id); chosen.push(best); }
    }
    return chosen.length === 4 ? chosen : null;
  }

  function startHandover() {
    const incoming = pickNewBearers();
    if (!incoming) { nextHand = time + 0.5; return; }
    handover = { t0: time, incoming: incoming, outgoing: bearers.slice() };
    for (let i = 0; i < incoming.length; i++) {
      incoming[i].role = "bearer";
      incoming[i].spd = 1;
    }
  }

  function finishHandover() {
    if (!handover) return;
    for (let i = 0; i < handover.outgoing.length; i++) {
      const p = handover.outgoing[i];
      p.role = "behind";
      p.slow = 1.05;
      p.spd = 0.985 + rand() * 0.02;
    }
    bearers = handover.incoming.slice();
    handover = null;
    handovers++;
    nextHand = time + HAND_EVERY * (0.9 + rand() * 0.2);
  }

  function recycle(p) {
    const center = Math.floor(LANES / 2);
    const tryX = [];
    for (let k = 3; k <= 6; k++) tryX.push(stretcher.x + GAP * k);
    let best = null, bestScore = -1;
    for (let i = 0; i < tryX.length; i++) {
      for (let lane = 0; lane < LANES; lane++) {
        if (lane === center) continue;
        const x = tryX[i] + nrand() * 3, y = laneY(lane);
        let nearby = 0;
        for (let j = 0; j < people.length; j++) {
          if (people[j] === p) continue;
          if (Math.hypot(people[j].x - x, people[j].y - y) < GAP * 0.85) nearby++;
        }
        const score = 10 - nearby * 3 - i * 0.2;
        if (score > bestScore) { bestScore = score; best = { x: x, lane: lane, y: y }; }
      }
    }
    p.x = best ? best.x : stretcher.x + GAP * 4;
    p.lane = best ? best.lane : (p.lane + 1) % LANES;
    if (p.lane === center) p.lane = (p.lane + 1) % LANES;
    p.y = best ? best.y : laneY(p.lane);
    p.role = "ahead";
    p.colorT = 0;
    p.slow = 0;
    p.spd = 0.985 + rand() * 0.03;
  }

  function maintainPack() {
    let front = -1e9, backP = null;
    let nAhead = 0;
    for (let i = 0; i < people.length; i++) {
      const p = people[i];
      if (p.x > front) front = p.x;
      if (!backP || p.x < backP.x) backP = p;
      if (p.x > stretcher.x + 10) nAhead++;
    }
    const needFront = front < stretcher.x + GAP * 4.3 || nAhead < 24;
    if (needFront && backP && backP.role !== "bearer" && backP.x < stretcher.x - GAP * 2.2) {
      recycle(backP);
    }
    const edge = VIEW_W * 0.52;
    for (let i = 0; i < people.length; i++) {
      const p = people[i];
      if (p.role !== "bearer" && p.x < camX - edge) recycle(p);
    }
  }

  function separate() {
    const cell = 22;
    const grid = new Map();
    function key(x, y) { return ((x / cell) | 0) + "," + ((y / cell) | 0); }
    for (let i = 0; i < people.length; i++) {
      const p = people[i];
      const k = key(p.x, p.y);
      if (!grid.has(k)) grid.set(k, []);
      grid.get(k).push(p);
    }
    for (let i = 0; i < people.length; i++) {
      const p = people[i];
      const cx = (p.x / cell) | 0, cy = (p.y / cell) | 0;
      for (let a = -1; a <= 1; a++) {
        for (let b = -1; b <= 1; b++) {
          const arr = grid.get((cx + a) + "," + (cy + b));
          if (!arr) continue;
          for (let j = 0; j < arr.length; j++) {
            const q = arr[j];
            if (q.id <= p.id) continue;
            let dx = q.x - p.x, dy = q.y - p.y;
            let d = Math.hypot(dx, dy);
            const min = p.r + q.r + 1.8;
            if (d < 0.001) { dx = 0.3; dy = 0.2; d = 0.36; }
            if (d < min) {
              const push = (min - d) * 0.46;
              const nx = dx / d, ny = dy / d;
              const pB = p.role === "bearer", qB = q.role === "bearer";
              if (pB && !qB) { q.x += nx * push * 2; q.y += ny * push * 2; }
              else if (qB && !pB) { p.x -= nx * push * 2; p.y -= ny * push * 2; }
              else if (!pB && !qB) {
                p.x -= nx * push; p.y -= ny * push;
                q.x += nx * push; q.y += ny * push;
              } else {
                p.y -= ny * push * 0.25;
                q.y += ny * push * 0.25;
              }
            }
          }
        }
      }
    }
    const hw = ST_W * 0.62 + R, hh = ST_H * 0.7 + R;
    const halfRoad = (LANES * LANE_GAP) / 2 + 8;
    for (let i = 0; i < people.length; i++) {
      const p = people[i];
      if (p.role !== "bearer") {
        const dx = p.x - stretcher.x, dy = p.y - stretcher.y;
        const ox = hw - Math.abs(dx), oy = hh - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          if (oy < ox) p.y += (dy >= 0 ? 1 : -1) * (oy + 1.2);
          else p.x += (dx >= 0 ? 1 : -1) * (ox + 1.2);
        }
      }
      if (p.role !== "bearer" && Math.abs(p.y) < 13) {
        p.y += (p.y >= 0 ? 1 : -1) * 1.4;
      }
      p.y = clamp(p.y, -halfRoad, halfRoad);
    }
  }

  function tick(dt) {
    if (dt > 0.05) dt = 0.05;
    time += dt;
    const walk = WALK * dt;

    if (handover) {
      const u = ease(Math.min(1, (time - handover.t0) / HAND_DUR));
      const prevU = ease(Math.max(0, (time - dt - handover.t0) / HAND_DUR));
      stretcher.x += walk + PASS * (u - prevU);
      if (time - handover.t0 >= HAND_DUR) finishHandover();
    } else {
      stretcher.x += walk;
      if (time >= nextHand) startHandover();
    }

    const sl = slotsAt(stretcher.x, stretcher.y);
    const incoming = handover ? handover.incoming : bearers;
    const outgoing = handover ? handover.outgoing : [];

    for (let i = 0; i < people.length; i++) {
      const p = people[i];
      p.phase += dt * 6 * p.spd;
      if (p.slow > 0) p.slow -= dt;
      const inIdx = incoming.indexOf(p);
      const isOut = outgoing.indexOf(p) !== -1;
      if (inIdx !== -1) {
        const t = handover ? ease((time - handover.t0) / HAND_DUR) : 1;
        p.x += (sl[inIdx].x - p.x) * (0.16 + 0.24 * t);
        p.y += (sl[inIdx].y - p.y) * (0.18 + 0.26 * t);
        p.x += walk;
        p.colorT = lerp(p.colorT, 0, 0.2);
      } else if (isOut) {
        const u = ease(clamp((time - handover.t0) / HAND_DUR, 0, 1));
        p.x += walk * (0.7 + 0.22 * (1 - u));
        const outY = laneY(p.lane) + Math.sign(p.y || 1) * 4;
        p.y += (outY - p.y) * 0.1;
      } else {
        const factor = p.slow > 0 ? 0.88 : p.spd;
        p.x += walk * factor;
        const targetY = laneY(p.lane) + Math.sin(p.phase * 0.35 + p.id) * 2.2;
        p.y += (targetY - p.y) * 0.06;
      }
      if (p.role !== "bearer") {
        if (p.x > stretcher.x + 10) {
          p.role = "ahead";
          p.colorT = Math.max(0, p.colorT - dt * 1.4);
        } else if (p.x < stretcher.x - 8) {
          p.role = "behind";
          p.colorT = Math.min(1, p.colorT + dt * 1.1);
        }
      }
    }

    separate();
    maintainPack();

    camX += (stretcher.x - camX) * 0.1;
  }

  function colorOf(p) {
    if (p.role === "bearer") return COL.bearer;
    if (p.role === "behind" || p.colorT > 0.02) return mix(COL.ahead, COL.behind, p.colorT);
    return COL.ahead;
  }

  function drawPerson(p) {
    const x = sx(p.x), y = sy(p.y) + Math.sin(p.phase) * 0.8;
    const c = colorOf(p);
    const rr = (p.r + (p.role === "bearer" ? 1.1 : 0)) * scale;
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.ellipse(0, rr * 0.8, rr * 0.95, rr * 0.38, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(70,50,25,0.22)";
    ctx.fill();
    if (p.role === "bearer") {
      ctx.beginPath();
      ctx.arc(0, -1, rr + 5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(212,137,42,0.26)";
      ctx.fill();
    }
    const lite = mix(c, [255, 245, 225], 0.35);
    const dark = mix(c, [40, 30, 20], 0.22);
    const g = ctx.createRadialGradient(-rr * 0.28, -rr * 0.42, 1, 0, 0, rr);
    g.addColorStop(0, rgb(lite));
    g.addColorStop(0.55, rgb(c));
    g.addColorStop(1, rgb(dark));
    ctx.beginPath();
    ctx.arc(0, -1, rr, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = Math.max(1, 1.1 * scale * 0.5);
    ctx.strokeStyle = rgb(dark, 0.8);
    ctx.stroke();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawStretcher() {
    const x = sx(stretcher.x), y = sy(stretcher.y);
    const w = ST_W * scale, h = ST_H * scale;
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.ellipse(0, h * 0.55, w * 0.52, h * 0.28, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(70,50,25,0.24)";
    ctx.fill();
    ctx.fillStyle = COL.woodDark;
    ctx.fillRect(-w * 0.64, -h * 0.12, w * 1.28, h * 0.24);
    const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, COL.woodLite);
    g.addColorStop(0.45, COL.wood);
    g.addColorStop(1, COL.woodDark);
    roundRect(-w / 2, -h / 2, w, h, 7 * scale * 0.4);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = COL.woodDark;
    ctx.lineWidth = Math.max(1.2, 1.4 * scale * 0.45);
    ctx.stroke();
    ctx.restore();
  }

  function drawRoad() {
    const half = ((LANES * LANE_GAP) / 2 + 22) * scale;
    const oy = H * 0.52;
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#efe6d4");
    bg.addColorStop(0.5, "#e6d8be");
    bg.addColorStop(1, "#deceb0");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#d9ccb0";
    ctx.fillRect(0, oy - half - 120, W, 120);
    ctx.fillRect(0, oy + half, W, 120);
    ctx.fillStyle = "#c4b193";
    ctx.fillRect(0, oy - half, W, half * 2);
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    ctx.fillRect(0, oy - half, W, 9);
    ctx.fillStyle = "rgba(80,55,25,0.10)";
    ctx.fillRect(0, oy + half - 9, W, 9);
    ctx.strokeStyle = "rgba(93,69,36,0.28)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, oy - half);
    ctx.lineTo(W, oy - half);
    ctx.moveTo(0, oy + half);
    ctx.lineTo(W, oy + half);
    ctx.stroke();
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, oy - half, W, half * 2);
    ctx.clip();
    ctx.fillStyle = "rgba(90,70,40,0.055)";
    const shift = -((camX * scale * 0.5) % 26);
    for (let x = shift; x < W + 20; x += 26) {
      for (let y = oy - half + 12; y < oy + half - 8; y += 32) {
        ctx.beginPath();
        ctx.arc(x + ((y * 13) % 9), y, 1.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawRoad();
    const arr = people.slice().sort(function (a, b) { return a.y - b.y; });
    let drawn = false;
    for (let i = 0; i < arr.length; i++) {
      if (!drawn && arr[i].y > stretcher.y) { drawStretcher(); drawn = true; }
      drawPerson(arr[i]);
    }
    if (!drawn) drawStretcher();
  }

  const STEP = 1 / 60;
  let acc = 0, last = performance.now(), raf = 0;
  function loop(now) {
    raf = requestAnimationFrame(loop);
    const raw = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (playing) {
      acc += raw * speed;
      while (acc >= STEP) { tick(STEP); acc -= STEP; }
    }
    render();
  }

  function getState() {
    const xs = people.map(function (p) { return p.x; }).sort(function (a, b) { return a - b; });
    const mean = xs.reduce(function (s, v) { return s + v; }, 0) / xs.length;
    let minD = 1e9, overlaps = 0;
    for (let i = 0; i < people.length; i++)
      for (let j = i + 1; j < people.length; j++) {
        const d = Math.hypot(people[i].x - people[j].x, people[i].y - people[j].y);
        if (d < minD) minD = d;
        if (d < (people[i].r + people[j].r) * 0.7) overlaps++;
      }
    const incoming = handover ? handover.incoming : bearers;
    return {
      time: time, stretcherX: stretcher.x, meanX: mean, medianX: xs[xs.length >> 1],
      fracBehind: people.filter(function (p) { return p.x < stretcher.x; }).length / people.length,
      nAhead: people.filter(function (p) { return p.role === "ahead"; }).length,
      nBehind: people.filter(function (p) { return p.role === "behind"; }).length,
      nBearers: people.filter(function (p) { return p.role === "bearer"; }).length,
      bearerIds: incoming.map(function (p) { return p.id; }),
      handovers: handovers, minDist: minD, overlaps: overlaps,
      people: people.length, playing: playing, scale: scale
    };
  }

  function setPlaying(v) {
    playing = v;
    btnPlay.textContent = playing ? "⏸ השהיה" : "▶ הפעלה";
    if (playing) last = performance.now();
  }

  btnPlay.addEventListener("click", function () { setPlaying(!playing); });
  btnRestart.addEventListener("click", function () { reset(); acc = 0; render(); });
  speedEl.addEventListener("change", function () { speed = parseFloat(speedEl.value); });
  legendEl.addEventListener("click", function () {
    legendEl.classList.add("hidden");
    showLeg.classList.remove("hidden");
  });
  showLeg.addEventListener("click", function () {
    showLeg.classList.add("hidden");
    legendEl.classList.remove("hidden");
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === " " || ev.code === "Space") { ev.preventDefault(); setPlaying(!playing); }
    else if (ev.key === "Home" || ev.key === "r" || ev.key === "R") { reset(); acc = 0; render(); }
  });
  window.addEventListener("resize", function () { resize(); render(); });

  window.Sim = {
    play: function () { setPlaying(true); },
    pause: function () { setPlaying(false); },
    restart: function () { reset(); acc = 0; render(); },
    setSpeed: function (v) { speed = v; speedEl.value = String(v); },
    tick: function (dt) { tick(dt); render(); },
    stepFixed: function (n) { for (let i = 0; i < n; i++) tick(STEP); render(); },
    getState: getState,
    frameJPEG: function (q) { return canvas.toDataURL("image/jpeg", q || 0.88); },
    get time() { return time; }
  };

  resize();
  reset();
  render();
  last = performance.now();
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
